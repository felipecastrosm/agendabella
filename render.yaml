# Blueprint do Render: cria o serviço web (API + front-end) e o banco PostgreSQL.
services:
  - type: web
    name: agendabella
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: TZ
        value: America/Sao_Paulo
      - key: DATABASE_URL
        fromDatabase:
          name: agendabella-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_SENHA
        sync: false # informada no painel do Render na criação; senha inicial da equipe
      - key: CORS_ORIGINS
        value: https://agendabella.onrender.com

databases:
  - name: agendabella-db
    plan: free
    region: virginia
    databaseName: agendabella
    user: agendabella
