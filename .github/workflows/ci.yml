name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Back-end (build, testes e cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificar build (importação da aplicação)
        run: python -c "from app.main import app; print(app.title)"

      - name: Executar testes unitários e de integração com cobertura
        env:
          JWT_SECRET: ci-secret-apenas-para-testes
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/coverage.xml

  frontend:
    name: Front-end (build de produção Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build

      - name: Verificar compatibilidade do index.html com a CSP (sem scripts inline)
        run: |
          if grep -Eq '<script>|<script [^>]*>[^<]+</script>|onload=' dist/frontend/browser/index.html; then
            echo "index.html contém script inline, que seria bloqueado pela Content Security Policy." >&2
            exit 1
          fi

      - name: Auditoria de dependências (vulnerabilidades altas ou críticas)
        run: npm audit --audit-level=high --omit=dev
